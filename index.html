<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StreamTube</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface-hover: #252530;
      --primary: #ff2a5f;
      --primary-hover: #e01e4f;
      --text: #f4f4f6;
      --text-muted: #9a9aa6;
      --border: #2c2c38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Contenedor superior fijo (Reproductor + Buscador) */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--surface);
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Reproductor 16:9 Responsivo */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Barra de información y controles */
    .now-playing {
      padding: 10px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .track-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: var(--surface-hover);
      border: none;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    .ctrl-btn.active {
      background: var(--primary);
      color: #fff;
    }

    /* Buscador */
    .search-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: var(--bg);
    }

    .search-bar input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--primary);
    }

    .search-bar button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Pestañas Resultados / Cola */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: var(--text);
      border-bottom-color: var(--primary);
    }

    /* Lista de videos */
    .content {
      flex: 1;
      padding: 10px 14px 40px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid transparent;
    }

    .video-item.playing {
      border-color: var(--primary);
      background: #231820;
    }

    .thumb-box {
      position: relative;
      width: 110px;
      min-width: 110px;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .video-info h3 {
      font-size: 0.85rem;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .video-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-btn {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .status-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="sticky-top">
    <header>
      <h1>▶ StreamTube</h1>
    </header>

    <div class="player-wrapper">
      <div id="player"></div>
    </div>

    <div class="now-playing">
      <div class="track-title" id="currentTitle">Busca un video para comenzar</div>
      <div class="controls">
        <div class="ctrl-group">
          <button class="ctrl-btn" id="prevBtn">⏮ Ant</button>
          <button class="ctrl-btn" id="playPauseBtn">⏯</button>
          <button class="ctrl-btn" id="nextBtn">Sig ⏭</button>
        </div>
        <div class="ctrl-group">
          <button class="ctrl-btn active" id="autoPlayBtn" title="Reproducción continua">🔁 Auto: ON</button>
        </div>
      </div>
    </div>

    <form class="search-bar" id="searchForm">
      <input type="text" id="searchInput" placeholder="Buscar canciones, artistas o videos..." required />
      <button type="submit">Buscar</button>
    </form>

    <div class="tabs">
      <div class="tab active" data-tab="results">Resultados (<span id="resultsCount">0</span>)</div>
      <div class="tab" data-tab="queue">Cola continua (<span id="queueCount">0</span>)</div>
    </div>
  </div>

  <main class="content">
    <div id="resultsView" class="video-list">
      <div class="status-msg">Escribe en el buscador para encontrar videos de YouTube.</div>
    </div>
    <div id="queueView" class="video-list" style="display: none;">
      <div class="status-msg">La cola de reproducción está vacía.</div>
    </div>
  </main>

  <script>
    // Limpia cualquier API Key guardada anteriormente en el navegador
    localStorage.removeItem("yt_api_key");

    let player = null;
    let isPlayerReady = false;
    let autoPlayEnabled = true;

    let searchResults = [];
    let queue = [];
    let currentIndex = -1;
    let activeTab = "results";

    // ==========================================
    // 1. CARGA DE YOUTUBE IFRAME PLAYER API
    // ==========================================
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        height: "100%",
        width: "100%",
        playerVars: {
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: () => {
            isPlayerReady = true;
          },
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    };

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED && autoPlayEnabled) {
        playNext();
      }
    }

    function onPlayerError() {
      if (autoPlayEnabled && queue.length > currentIndex + 1) {
        document.getElementById("currentTitle").textContent = "Video restringido, saltando al siguiente...";
        setTimeout(playNext, 1200);
      }
    }

    // ==========================================
    // 2. BÚSQUEDA A TRAVÉS DE TU BACKEND EN RENDER
    // ==========================================
    async function searchYouTube(query) {
      const resultsView = document.getElementById("resultsView");
      resultsView.innerHTML = '<div class="status-msg">Buscando...</div>';
      switchTab("results");

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (!response.ok) {
          const msg = data.error || "Error al consultar el servidor.";
          resultsView.innerHTML = `<div class="status-msg">⚠️ ${escapeHTML(msg)}</div>`;
          return;
        }

        searchResults = (data.items || []).map((item) => ({
          id: item.id,
          title: decodeHTML(item.title),
          channel: item.channel,
          thumbnail: item.thumbnail
        }));

        document.getElementById("resultsCount").textContent = searchResults.length;
        renderResults();
      } catch (err) {
        resultsView.innerHTML = '<div class="status-msg">⚠️ Error de red al conectar con el servidor.</div>';
      }
    }

    // ==========================================
    // 3. CONTROL DE REPRODUCCIÓN Y COLA CONTINUA
    // ==========================================
    function playFromResults(index) {
      queue = [...searchResults];
      currentIndex = index;
      playTrackAt(currentIndex);
      renderQueue();
    }

    function addToQueue(video) {
      queue.push(video);
      document.getElementById("queueCount").textContent = queue.length;
      renderQueue();
      if (currentIndex === -1) {
        currentIndex = 0;
        playTrackAt(0);
      }
    }

    function playTrackAt(index) {
      if (index < 0 || index >= queue.length) return;
      currentIndex = index;
      const track = queue[currentIndex];

      document.getElementById("currentTitle").textContent = track.title;
      document.getElementById("queueCount").textContent = queue.length;

      if (isPlayerReady && player) {
        player.loadVideoById(track.id);
      }

      renderResults();
      renderQueue();
    }

    function playNext() {
      if (currentIndex + 1 < queue.length) {
        playTrackAt(currentIndex + 1);
      }
    }

    function playPrev() {
      if (currentIndex - 1 >= 0) {
        playTrackAt(currentIndex - 1);
      }
    }

    function removeFromQueue(index) {
      queue.splice(index, 1);
      if (index < currentIndex) {
        currentIndex--;
      } else if (index === currentIndex) {
        if (queue.length > 0) {
          playTrackAt(Math.min(currentIndex, queue.length - 1));
        } else {
          currentIndex = -1;
          player?.stopVideo();
          document.getElementById("currentTitle").textContent = "Cola vacía";
        }
      }
      document.getElementById("queueCount").textContent = queue.length;
      renderQueue();
    }

    // ==========================================
    // 4. RENDERIZADO DE INTERFAZ
    // ==========================================
    function renderResults() {
      const container = document.getElementById("resultsView");
      if (searchResults.length === 0) {
        container.innerHTML = '<div class="status-msg">No se encontraron videos.</div>';
        return;
      }

      const currentVideoId = queue[currentIndex]?.id;
      container.innerHTML = "";

      searchResults.forEach((video, idx) => {
        const isPlaying = video.id === currentVideoId;
        const card = document.createElement("div");
        card.className = `video-item ${isPlaying ? "playing" : ""}`;
        card.innerHTML = `
          <div class="thumb-box">
            <img src="${video.thumbnail}" alt="" loading="lazy" />
          </div>
          <div class="video-info">
            <h3>${escapeHTML(video.title)}</h3>
            <p>${escapeHTML(video.channel)}</p>
          </div>
          <button class="action-btn">+ Cola</button>
        `;

        card.querySelector(".thumb-box").onclick = () => playFromResults(idx);
        card.querySelector(".video-info").onclick = () => playFromResults(idx);
        card.querySelector(".action-btn").onclick = (e) => {
          e.stopPropagation();
          addToQueue(video);
          e.target.textContent = "✓";
          setTimeout(() => (e.target.textContent = "+ Cola"), 900);
        };

        container.appendChild(card);
      });
    }

    function renderQueue() {
      const container = document.getElementById("queueView");
      if (queue.length === 0) {
        container.innerHTML = '<div class="status-msg">La cola de reproducción está vacía.</div>';
        return;
      }

      container.innerHTML = "";
      queue.forEach((video, idx) => {
        const isPlaying = idx === currentIndex;
        const card = document.createElement("div");
        card.className = `video-item ${isPlaying ? "playing" : ""}`;
        card.innerHTML = `
          <div class="thumb-box">
            <img src="${video.thumbnail}" alt="" loading="lazy" />
          </div>
          <div class="video-info">
            <h3>${isPlaying ? "▶ " : ""}${escapeHTML(video.title)}</h3>
            <p>${escapeHTML(video.channel)}</p>
          </div>
          <button class="action-btn">✕</button>
        `;

        card.querySelector(".thumb-box").onclick = () => playTrackAt(idx);
        card.querySelector(".video-info").onclick = () => playTrackAt(idx);
        card.querySelector(".action-btn").onclick = () => removeFromQueue(idx);

        container.appendChild(card);
      });
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll(".tab").forEach((t) => {
        t.classList.toggle("active", t.dataset.tab === tabName);
      });
      document.getElementById("resultsView").style.display = tabName === "results" ? "flex" : "none";
      document.getElementById("queueView").style.display = tabName === "queue" ? "flex" : "none";
    }

    function decodeHTML(str) {
      const txt = document.createElement("textarea");
      txt.innerHTML = str;
      return txt.value;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    // ==========================================
    // 5. EVENTOS DE BOTONES Y FORMULARIO
    // ==========================================
    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("searchInput").value.trim();
      if (q) searchYouTube(q);
    });

    document.getElementById("nextBtn").onclick = playNext;
    document.getElementById("prevBtn").onclick = playPrev;

    document.getElementById("playPauseBtn").onclick = () => {
      if (!isPlayerReady || !player) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    };

    document.getElementById("autoPlayBtn").onclick = (e) => {
      autoPlayEnabled = !autoPlayEnabled;
      e.target.textContent = autoPlayEnabled ? "🔁 Auto: ON" : "🔁 Auto: OFF";
      e.target.classList.toggle("active", autoPlayEnabled);
    };

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.onclick = () => switchTab(tab.dataset.tab);
    });
  </script>
</body>
</html>
