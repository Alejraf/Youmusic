<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StreamFocus - Sala de Reproducción</title>

  <!-- Configuración PWA para mantener el modo pantalla completa sin barra de Chrome -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#07080c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="/icon-192.png" />

  <!-- SIN SCRIPTS DE PUBLICIDAD: Esta página está 100% limpia -->
  <style>
    :root {
      --bg: #07080c;
      --surface: #151823;
      --surface-hover: #1f2433;
      --primary: #00d285;
      --primary-text: #041a11;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #252a3a;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .player-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #11141d;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back-btn {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .timer-pill {
      background: #192236;
      color: #93c5fd;
      border: 1px solid #2b3c61;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .inner-search {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      background: #0d1017;
      border-bottom: 1px solid var(--border);
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .inner-search input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }

    .inner-search button {
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      padding: 0 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .player-box {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }

    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .player-panel {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 14px 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .now-title {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .now-channel {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: -6px;
    }

    .player-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 9px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .ctrl-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ctrl-btn {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .ctrl-btn.active {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }

    .notes-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .notes-box textarea {
      width: 100%;
      min-height: 64px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.84rem;
      resize: vertical;
      outline: none;
    }

    .list-heading {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 4px;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .thumb-box {
      position: relative;
      width: 116px;
      min-width: 116px;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.28);
      font-size: 1.1rem;
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-info h3 {
      font-size: 0.85rem;
      line-height: 1.28;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }

    .video-info p {
      font-size: 0.73rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 24px 12px;
      font-size: 0.86rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      max-width: 440px;
      width: 100%;
    }

    .modal-card h2 {
      font-size: 1.05rem;
      margin-bottom: 10px;
    }

    .modal-card p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
  </style>
</head>
<body>

  <div class="player-topbar">
    <a href="/" class="back-btn">← Inicio y Cursos</a>
    <button class="timer-pill" id="openTimerBtn">⏱ Temporizador: OFF</button>
  </div>

  <form class="inner-search" id="innerSearchForm">
    <input type="text" id="innerSearchInput" placeholder="Buscar otro video en YouTube..." required />
    <button type="submit">Buscar</button>
  </form>

  <div class="player-box">
    <div id="player"></div>
  </div>

  <div class="player-panel">
    <div class="now-title" id="nowTitle">Cargando...</div>
    <div class="now-channel" id="nowChannel"></div>

    <div class="player-controls">
      <div class="ctrl-group">
        <button class="ctrl-btn" id="prevBtn">⏮ Ant</button>
        <button class="ctrl-btn" id="playPauseBtn">⏯</button>
        <button class="ctrl-btn" id="nextBtn">Sig ⏭</button>
      </div>
      <div class="ctrl-group">
        <button class="ctrl-btn" id="saveCurrentFavBtn">☆ Guardar</button>
        <button class="ctrl-btn active" id="autoPlayBtn">🔁 Auto: ON</button>
      </div>
    </div>

    <div class="notes-box">
      <div class="notes-header">
        <span>📝 Apuntes de esta clase / video (guardados en tu teléfono)</span>
        <span id="noteSavedTag" style="color: var(--primary);"></span>
      </div>
      <textarea id="videoNoteInput" placeholder="Escribe notas rápidas mientras ves el video..."></textarea>
    </div>

    <div class="list-heading" id="playerListHeading">Resultados y cola continua</div>
    <div id="playerQueueList" class="queue-list"></div>
  </div>

  <!-- Modal Temporizador -->
  <div class="modal-backdrop" id="timerModal">
    <div class="modal-card">
      <h2>⏱ Temporizador de apagado automático</h2>
      <p>Pausa el video automáticamente cuando termine el tiempo elegido.</p>
      <div class="timer-grid">
        <button class="ctrl-btn" data-mins="15">15 minutos</button>
        <button class="ctrl-btn" data-mins="30">30 minutos</button>
        <button class="ctrl-btn" data-mins="45">45 minutos</button>
        <button class="ctrl-btn" data-mins="60">60 minutos</button>
      </div>
      <div style="display: flex; justify-content: space-between; gap: 8px; margin-top: 10px;">
        <button class="ctrl-btn" id="cancelTimerBtn" style="color: var(--danger);">Desactivar</button>
        <button class="ctrl-btn active" id="closeTimerModalBtn">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    let player = null;
    let isPlayerReady = false;
    let autoPlayEnabled = true;

    let queue = [];
    let currentIndex = -1;
    let favorites = JSON.parse(localStorage.getItem("sf_favorites") || "[]");
    let notesMap = JSON.parse(localStorage.getItem("sf_notes") || "{}");

    let sleepTimerId = null;
    let sleepRemainingSec = 0;

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        height: "100%",
        width: "100%",
        playerVars: {
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: () => {
            isPlayerReady = true;
            if (currentIndex >= 0 && queue[currentIndex]) {
              player.loadVideoById(queue[currentIndex].id);
            }
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED && autoPlayEnabled) {
              playNext();
            }
          },
          onError: () => {
            if (autoPlayEnabled && queue.length > currentIndex + 1) {
              document.getElementById("nowTitle").textContent = "Video restringido, saltando al siguiente...";
              setTimeout(playNext, 1200);
            }
          }
        }
      });
    };

    async function searchYouTube(query) {
      document.getElementById("innerSearchInput").value = query;
      document.getElementById("playerListHeading").textContent = `Buscando "${query}"...`;
      const listContainer = document.getElementById("playerQueueList");
      listContainer.innerHTML = '<div class="status-msg">Buscando videos en YouTube...</div>';

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (!response.ok) {
          listContainer.innerHTML = `<div class="status-msg">⚠️ ${escapeHTML(data.error || "Error en la búsqueda.")}</div>`;
          return;
        }

        const results = (data.items || []).map((item) => ({
          id: item.id,
          title: decodeHTML(item.title),
          channel: item.channel,
          thumbnail: item.thumbnail
        }));

        if (results.length === 0) {
          document.getElementById("playerListHeading").textContent = "Sin resultados";
          listContainer.innerHTML = '<div class="status-msg">No se encontraron videos para esa búsqueda.</div>';
          return;
        }

        queue = results;
        document.getElementById("playerListHeading").textContent = `Resultados para "${query}" (${queue.length})`;
        playTrackAt(0);
      } catch (err) {
        listContainer.innerHTML = '<div class="status-msg">⚠️ Error de red al conectar con el servidor.</div>';
      }
    }

    function playTrackAt(index) {
      if (index < 0 || index >= queue.length) return;
      currentIndex = index;
      const track = queue[currentIndex];

      document.getElementById("nowTitle").textContent = track.title;
      document.getElementById("nowChannel").textContent = track.channel;
      document.getElementById("videoNoteInput").value = notesMap[track.id] || "";
      document.getElementById("noteSavedTag").textContent = "";
      updateFavButtonState(track.id);

      if (isPlayerReady && player && typeof player.loadVideoById === "function") {
        player.loadVideoById(track.id);
      }

      renderPlayerQueue();
    }

    function playNext() {
      if (currentIndex + 1 < queue.length) playTrackAt(currentIndex + 1);
    }

    function playPrev() {
      if (currentIndex - 1 >= 0) playTrackAt(currentIndex - 1);
    }

    function renderPlayerQueue() {
      const container = document.getElementById("playerQueueList");
      container.innerHTML = "";

      queue.forEach((video, idx) => {
        const isCurrent = idx === currentIndex;
        const card = document.createElement("div");
        card.className = "video-card";
        if (isCurrent) card.style.borderColor = "var(--primary)";

        card.innerHTML = `
          <div class="thumb-box">
            <img src="${video.thumbnail}" alt="" loading="lazy" />
            <div class="play-badge">${isCurrent ? "❚❚" : "▶"}</div>
          </div>
          <div class="video-info">
            <h3>${isCurrent ? "▶ " : ""}${escapeHTML(video.title)}</h3>
            <p>${escapeHTML(video.channel)}</p>
          </div>
        `;

        card.onclick = () => playTrackAt(idx);
        container.appendChild(card);
      });
    }

    function toggleFavorite(video) {
      const idx = favorites.findIndex((f) => f.id === video.id);
      if (idx >= 0) {
        favorites.splice(idx, 1);
      } else {
        favorites.unshift(video);
      }
      localStorage.setItem("sf_favorites", JSON.stringify(favorites));
      updateFavButtonState(video.id);
    }

    function updateFavButtonState(videoId) {
      const isFav = favorites.some((f) => f.id === videoId);
      const btn = document.getElementById("saveCurrentFavBtn");
      btn.textContent = isFav ? "★ Guardado" : "☆ Guardar";
      btn.classList.toggle("active", isFav);
    }

    document.getElementById("videoNoteInput").addEventListener("input", (e) => {
      const track = queue[currentIndex];
      if (!track) return;
      const text = e.target.value;
      if (text.trim()) {
        notesMap[track.id] = text;
      } else {
        delete notesMap[track.id];
      }
      localStorage.setItem("sf_notes", JSON.stringify(notesMap));
      document.getElementById("noteSavedTag").textContent = "Guardado ✓";
    });

    document.getElementById("innerSearchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("innerSearchInput").value.trim();
      if (q) {
        const url = new URL(window.location);
        url.searchParams.set("q", q);
        url.searchParams.delete("mode");
        window.history.replaceState({}, "", url);
        searchYouTube(q);
      }
    });

    document.getElementById("nextBtn").onclick = playNext;
    document.getElementById("prevBtn").onclick = playPrev;

    document.getElementById("playPauseBtn").onclick = () => {
      if (!isPlayerReady || !player) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    };

    document.getElementById("autoPlayBtn").onclick = (e) => {
      autoPlayEnabled = !autoPlayEnabled;
      e.target.textContent = autoPlayEnabled ? "🔁 Auto: ON" : "🔁 Auto: OFF";
      e.target.classList.toggle("active", autoPlayEnabled);
    };

    document.getElementById("saveCurrentFavBtn").onclick = () => {
      const track = queue[currentIndex];
      if (track) toggleFavorite(track);
    };

    const timerModal = document.getElementById("timerModal");
    const timerBtn = document.getElementById("openTimerBtn");

    function startSleepTimer(minutes) {
      clearInterval(sleepTimerId);
      sleepRemainingSec = minutes * 60;
      updateTimerLabel();
      timerModal.classList.remove("open");

      sleepTimerId = setInterval(() => {
        sleepRemainingSec--;
        if (sleepRemainingSec <= 0) {
          clearInterval(sleepTimerId);
          sleepTimerId = null;
          timerBtn.textContent = "⏱ Temporizador: OFF";
          if (isPlayerReady && player && typeof player.pauseVideo === "function") {
            player.pauseVideo();
          }
          document.getElementById("nowTitle").textContent = "⏸ Pausado por temporizador";
        } else {
          updateTimerLabel();
        }
      }, 1000);
    }

    function updateTimerLabel() {
      const m = Math.floor(sleepRemainingSec / 60);
      const s = String(sleepRemainingSec % 60).padStart(2, "0");
      timerBtn.textContent = `⏱ ${m}:${s}`;
    }

    timerBtn.onclick = () => timerModal.classList.add("open");
    document.getElementById("closeTimerModalBtn").onclick = () => timerModal.classList.remove("open");
    document.getElementById("cancelTimerBtn").onclick = () => {
      clearInterval(sleepTimerId);
      sleepTimerId = null;
      timerBtn.textContent = "⏱ Temporizador: OFF";
      timerModal.classList.remove("open");
    };
    document.querySelectorAll("[data-mins]").forEach((btn) => {
      btn.onclick = () => startSleepTimer(Number(btn.dataset.mins));
    });

    function decodeHTML(str) {
      const txt = document.createElement("textarea");
      txt.innerHTML = str;
      return txt.value;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get("q");
    const mode = params.get("mode");

    if (initialQuery) {
      searchYouTube(initialQuery);
    } else if (mode === "list") {
      const savedQueue = JSON.parse(sessionStorage.getItem("sf_active_queue") || "[]");
      const savedIdx = Number(sessionStorage.getItem("sf_active_index") || "0");
      if (savedQueue.length > 0) {
        queue = savedQueue;
        document.getElementById("playerListHeading").textContent = `Lista de reproducción (${queue.length})`;
        playTrackAt(savedIdx);
      }
    }
  </script>
</body>
</html>
